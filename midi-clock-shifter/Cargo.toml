[package]
name = "midi-clock-shifter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.36.2"
libloading = "0.9.0"
log = "0.4.34"
midir = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spin_sleep = "1.3.3"
thiserror = "2.0.20"
windows = { version = "0.62.2", features = ["Win32_Media", "Win32_System_Threading", "Win32_Foundation"] }
